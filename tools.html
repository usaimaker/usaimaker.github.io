    <!-- GA4 Custom Event Tracking -->
    <script>
        // Track user registration
        function trackRegistration(method) {
            gtag('event', 'sign_up', {
                'method': method,
                'event_category': 'engagement',
                'event_label': 'user_registration'
            });
        }

        // Track VIP purchase
        function trackVIPPurchase(plan, price) {
            gtag('event', 'purchase', {
                'currency': 'USD',
                'value': price,
                'items': [{
                    'item_name': plan,
                    'item_category': 'VIP_Membership',
                    'price': price
                }],
                'event_category': 'ecommerce',
                'event_label': 'vip_purchase'
            });
        }

        // Track article reading depth
        let maxScrollPercent = 0;
        function trackReadingDepth() {
            const scrollPercent = Math.round((window.scrollY / (document.body.scrollHeight - window.innerHeight)) * 100);
            if (scrollPercent > maxScrollPercent) {
                maxScrollPercent = scrollPercent;
                
                // Track at 25%, 50%, 75%, 100%
                const milestones = [25, 50, 75, 100];
                for (let milestone of milestones) {
                    if (scrollPercent >= milestone && maxScrollPercent < milestone + 25) {
                        gtag('event', 'scroll_depth', {
                            'percent_scrolled': milestone,
                            'event_category': 'engagement',
                            'event_label': 'article_reading'
                        });
                        break;
                    }
                }
            }
        }

        // Track tool clicks
        function trackToolClick(toolName, category) {
            gtag('event', 'tool_click', {
                'tool_name': toolName,
                'tool_category': category,
                'event_category': 'engagement',
                'event_label': 'tool_usage'

        // Track affiliate link clicks
        function trackAffiliateClick(affiliateName, url) {

                'affiliate_name': affiliateName,
                'link_url': url,
                'event_category': 'monetization',
                'event_label': 'affiliate_link'
            });
        }

        // Track article views
        function trackArticleView(articleTitle, category) {
            gtag('event', 'page_view', {
                'page_title': articleTitle,
                'content_category': category,
                'event_category': 'engagement'
            });
        }

        // Add scroll tracking listener
        window.addEventListener('scroll', trackReadingDepth);
    </script>

    <script src="data/tools.js"></script>
    <script>
        function renderTools(category = 'all') {
            const container = document.getElementById('tools-container');
            const filteredTools = category === 'all' 
                ? toolsData 
                : toolsData.filter(t => t.category === category);
            
            container.innerHTML = filteredTools.map(tool => {
                const toolKey = (tool.url || '').replace(/^https?:\/\/(www\.)?/, '').replace(/\/.*$/, '').replace(/\..*$/, '');
                const goUrl = `go.html?tool=${encodeURIComponent(toolKey)}&url=${encodeURIComponent(tool.url)}`;
                return `
                <div class="tool-card">
                    <div class="tool-header">
                        <div class="tool-emoji">${tool.emoji}</div>
                        <h3>${tool.name}</h3>
                        ${tool.badge ? `<span class="tool-badge">${tool.badge}</span>` : ''}
                    </div>
                    <div class="tool-body">
                        <p>${tool.description}</p>
                        <div class="tool-meta">
                            <span>💰 ${tool.price}</span>
                            <span>${tool.rating}</span>
                        </div>
                        <a href="${goUrl}" target="_blank" rel="noopener" class="tool-btn" onclick="trackToolClick('${tool.name.replace(/'/g, "")}', '${tool.category}'); trackAffiliateClick('${tool.name.replace(/'/g, "")}', '${tool.url}');">
                            Visit Site →
                        </a>
                    </div>
                </div>
                `;
            }).join('');
        }
        
        function renderComparison() {
            const tbody = document.getElementById('comparison-body');
            const topTools = toolsData.slice(0, 8);
            
            tbody.innerHTML = topTools.map(tool => `
                <tr>
                    <td><strong>${tool.emoji} ${tool.name}</strong></td>
                    <td>${tool.badge || tool.category}</td>
                    <td>${tool.price}</td>
                    <td>${tool.rating}</td>
                </tr>
            `).join('');
        }
        
        // Filter buttons
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                renderTools(btn.dataset.category);
            });
        });
        
        renderTools();
        renderComparison();
    </script>
