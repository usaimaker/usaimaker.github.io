    <!-- GA4 Custom Event Tracking -->
    <script>
        // Track user registration
        function trackRegistration(method) {
            gtag('event', 'sign_up', {
                'method': method,
                'event_category': 'engagement',
                'event_label': 'user_registration'
            });
        }

        // Track VIP purchase
        function trackVIPPurchase(plan, price) {
            gtag('event', 'purchase', {
                'currency': 'USD',
                'value': price,
                'items': [{
                    'item_name': plan,
                    'item_category': 'VIP_Membership',
                    'price': price
                }],
                'event_category': 'ecommerce',
                'event_label': 'vip_purchase'
            });
        }

        // Track article reading depth
        let maxScrollPercent = 0;
        function trackReadingDepth() {
            const scrollPercent = Math.round((window.scrollY / (document.body.scrollHeight - window.innerHeight)) * 100);
            if (scrollPercent > maxScrollPercent) {
                maxScrollPercent = scrollPercent;
                
                // Track at 25%, 50%, 75%, 100%
                const milestones = [25, 50, 75, 100];
                for (let milestone of milestones) {
                    if (scrollPercent >= milestone && maxScrollPercent < milestone + 25) {
                        gtag('event', 'scroll_depth', {
                            'percent_scrolled': milestone,
                            'event_category': 'engagement',
                            'event_label': 'article_reading'
                        });
                        break;
                    }
                }
            }
        }

        // Track tool clicks
        function trackToolClick(toolName, category) {
            gtag('event', 'tool_click', {
                'tool_name': toolName,
                'tool_category': category,
                'event_category': 'engagement',
                'event_label': 'tool_usage'
            });
        }

        // Track affiliate link clicks
        function trackAffiliateClick(affiliateName, url) {
            gtag('event', 'affiliate_click', {
                'affiliate_name': affiliateName,
                'link_url': url,
                'event_category': 'monetization',
                'event_label': 'affiliate_link'
            });
        }

        // Track article views
        function trackArticleView(articleTitle, category) {
            gtag('event', 'page_view', {
                'page_title': articleTitle,
                'content_category': category,
                'event_category': 'engagement'
            });
        }

        // Add scroll tracking listener
        window.addEventListener('scroll', trackReadingDepth);
    </script>

    <script>
        // Render comments section
        function renderComments(comments) {
            if (!comments || comments.length === 0) {
                return `
                    <div class="comments-section">
                        <div class="comments-header">
                            <h3>Comments</h3>
                            <span class="comment-count">0</span>
                        </div>
                        <p style="color: #888; text-align: center; padding: 40px 0;">
                            No comments yet. Be the first to share your thoughts!
                        </p>
                    </div>
                `;
            }
            
            const commentsHtml = comments.map(comment => {
                const timeAgo = getTimeAgo(comment.timestamp);
                const verifiedBadge = comment.isVerified ? '<span class="verified-badge">✓ Verified</span>' : '';
                
                return `
                    <div class="comment-card">
                        <div class="comment-header">
                            <img src="${comment.avatar}" alt="${comment.displayName}" class="comment-avatar">
                            <div class="comment-author">
                                <div class="comment-author-name">
                                    ${comment.displayName}
                                    ${verifiedBadge}
                                </div>
                                <div class="comment-username">@${comment.username}</div>
                            </div>
                            <span class="comment-time">${timeAgo}</span>
                        </div>
                        <div class="comment-content">
                            ${comment.content}
                        </div>
                        <div class="comment-actions">
                            <span class="comment-action">
                                ❤️ ${comment.likes || 0}
                            </span>
                            <span class="comment-action">
                                💬 ${comment.replies || 0} replies
                            </span>
                        </div>
                    </div>
                `;
            }).join('');
            
            return `
                <div class="comments-section">
                    <div class="comments-header">
                        <h3>Comments</h3>
                        <span class="comment-count">${comments.length}</span>
                    </div>
                    ${commentsHtml}
                </div>
            `;
        }
        
        // Calculate time ago
        function getTimeAgo(timestamp) {
            const now = new Date();
            const then = new Date(timestamp);
            const seconds = Math.floor((now - then) / 1000);
            
            if (seconds < 60) return 'just now';
            if (seconds < 3600) return `${Math.floor(seconds / 60)}m ago`;
            if (seconds < 86400) return `${Math.floor(seconds / 3600)}h ago`;
            if (seconds < 604800) return `${Math.floor(seconds / 86400)}d ago`;
            if (seconds < 2592000) return `${Math.floor(seconds / 604800)}w ago`;
            
            return then.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        }
        
        async function loadArticle() {
            const container = document.getElementById('article-container');
            const params = new URLSearchParams(window.location.search);
            const slug = params.get('slug');
            
            if (!slug) {
                container.innerHTML = '<div class="article-error"><h2>Article not found</h2><p><a href="articles.html">Browse all articles</a></p></div>';
                return;
            }
            
            try {
                // First, get the article index to find the date
                const indexResponse = await fetch('data/articles-index.json');
                if (!indexResponse.ok) throw new Error('Index not found');
                
                const articles = await indexResponse.json();
                const articleInfo = articles.find(a => a.slug === slug);
                
                if (!articleInfo) {
                    container.innerHTML = `
                        <div class="article-error">
                            <h2>Article not found</h2>
                            <p>This article doesn't exist in our index.</p>
                            <p><a href="articles.html">Browse all articles</a></p>
                        </div>
                    `;
                    return;
                }
                
                // Build the correct filename: date-slug.json
                const filename = `${articleInfo.date}-${slug}.json`;
                const response = await fetch(`data/articles/${filename}`);
                if (!response.ok) throw new Error('Article file not found');
                
                const article = await response.json();
                const articleUrl = `https://usaimaker.github.io/articles/${articleInfo.date}-${slug}.html`;
                
                // Update page title
                document.title = `${article.title} - AI Frontier`;
                
                // Update meta description
                const metaDesc = document.querySelector('meta[name="description"]');
                if (metaDesc) {
                    metaDesc.content = article.excerpt || article.content.substring(0, 160);
                }
                
                // Update canonical URL
                const canonical = document.querySelector('link[rel="canonical"]');
                if (canonical) {
                    canonical.href = articleUrl;
                }
                
                // Update Open Graph tags
                document.querySelector('meta[property="og:url"]').content = articleUrl;
                document.querySelector('meta[property="og:title"]').content = article.title;
                document.querySelector('meta[property="og:description"]').content = article.excerpt || article.content.substring(0, 160);
                document.querySelector('meta[property="article:published_time"]')?.setAttribute('content', article.date);
                
                // Update Twitter Card tags
                document.querySelector('meta[name="twitter:title"]').content = article.title;
                document.querySelector('meta[name="twitter:description"]').content = article.excerpt || article.content.substring(0, 160);
                
                // Update AI content date
                document.querySelector('meta[name="ai-content-date"]').content = article.date;
                
                // Update JSON-LD structured data
                const jsonLd = {
                    "@context": "https://schema.org",
                    "@type": "Article",
                    "headline": article.title,
                    "description": article.excerpt || article.content.substring(0, 160),
                    "image": "https://usaimaker.github.io/og-image.png",
                    "author": {
                        "@type": "Organization",
                        "name": "AI Frontier"
                    },
                    "publisher": {
                        "@type": "Organization",
                        "name": "AI Frontier",
                        "url": "https://usaimaker.github.io/",
                        "logo": {
                            "@type": "ImageObject",
                            "url": "https://usaimaker.github.io/favicon.svg"
                        }
                    },
                    "datePublished": article.date,
                    "dateModified": article.date,
                    "mainEntityOfPage": {
                        "@type": "WebPage",
                        "@id": articleUrl
                    },
                    "url": articleUrl,
                    "articleSection": article.category,
                    "wordCount": article.content.split(/\s+/).length,
                    "timeRequired": `PT${article.readTime.replace(' min read', '')}M`
                };
                
                document.getElementById('article-jsonld').textContent = JSON.stringify(jsonLd);
                
                // Format content (convert ## to h2)
                const formattedContent = article.content
                    .split('\n')
                    .map(line => {
                        if (line.startsWith('## ')) {
                            return `<h2>${line.substring(3)}</h2>`;
                        }
                        if (line.trim() === '') {
                            return '</p><p>';
                        }
                        return line;
                    })
                    .join(' ');
                
                container.innerHTML = `
                    <header class="article-header">
                        <div class="article-meta">
                            <span class="article-category" itemprop="articleSection">${article.category}</span>
                            <span itemprop="datePublished">${article.date}</span>
                            <span>${article.readTime}</span>
                        </div>
                        <h1 itemprop="headline">${article.title}</h1>
                        <p itemprop="description" style="display:none;">${article.excerpt || ''}</p>
                    </header>
                    
                    <div class="article-stats">
                        <div class="stat-item">
                            <span class="stat-icon">👁️</span>
                            <span class="stat-value">${(article.viewCount || 0).toLocaleString()}</span>
                            <span>views</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-icon">❤️</span>
                            <span class="stat-value">${article.likeCount || 0}</span>
                            <span>likes</span>
                        </div>
                        <div class="stat-item">
                            <span class="stat-icon">💬</span>
                            <span class="stat-value">${article.commentCount || 0}</span>
                            <span>comments</span>
                        </div>
                    </div>
                    
                    <div class="article-content" itemprop="articleBody">
                        <p>${formattedContent}</p>
                    </div>
                    
                    <div class="share-section">
                        <h3>Share this article</h3>
                        <div class="share-buttons">
                            <a href="https://twitter.com/intent/tweet?text=${encodeURIComponent(article.title)}&url=${encodeURIComponent(articleUrl)}" target="_blank" class="share-btn x">X</a>
                            <a href="https://www.linkedin.com/shareArticle?mini=true&url=${encodeURIComponent(articleUrl)}&title=${encodeURIComponent(article.title)}" target="_blank" class="share-btn linkedin">LinkedIn</a>
                            <a href="https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(articleUrl)}" target="_blank" class="share-btn facebook">Facebook</a>
                            <a href="https://www.reddit.com/submit?url=${encodeURIComponent(articleUrl)}&title=${encodeURIComponent(article.title)}" target="_blank" class="share-btn reddit">Reddit</a>
                        </div>
                    </div>
                    
                    ${renderComments(article.comments || [])}
                `;
                
            } catch (error) {
                container.innerHTML = `
                    <div class="article-error">
                        <h2>Article not found</h2>
                        <p>This article may have been moved or doesn't exist yet.</p>
                        <p><a href="articles.html">Browse all articles</a></p>
                    </div>
                `;
            }
        }
        
        loadArticle();
    </script>
